<html>
<head>
    <meta charset="utf-8">
    <title>Tạo form và các điều khiển trên form</title>
</head>
<body>
    <h2 align="center"><font color="#A52A2A">Đăng nhập</font></h2>

    <form id="formDangNhap">
        <table border="1" cellpadding="5" cellspacing="0" align="center" style="border-collapse: collapse; width: 300px;">
            <tr>
                <td bgcolor="#E6F2FF">Mã người dùng:</td>
                <td><input type="text" id="txtMa" style="width: 100%;"></td>
            </tr>
            <tr>
                <td bgcolor="#E6F2FF">Mật khẩu:</td>
                <td><input type="password" id="txtMatKhau" style="width: 100%;"></td>
            </tr>
            <tr align="center">
                <td colspan="2">
                    <input type="button" value="Đồng ý" onclick="document.getElementById('lblKetQua').innerText = document.getElementById('txtMa').value;">
                </td>
            </tr>
            <tr align="center">
                <td colspan="2" height="30">
                    <div id="lblKetQua" style="color: blue; font-weight: bold;"></div>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
